<body>

    <h1>Widget test</h1>
 
  <div id="architecture-widget" > </div> 
  

  
  <script type="module"  >
        // import `${API_BASE_URL}/widget/wuli-architecture.js`;
         const response =  await fetch("./downloadTest.json");
        
        if (!response.ok) {
             throw new Error(
                `Failed to load diagram.json: ${response.status}`
            );
         }
         const pageData =await response.json();
 
        //--------------------------------------------------
        // Render widget
        //--------------------------------------------------
         WuliArchitecture.render({

             container:document.getElementById("architecture-widget"),
             pageData,
             collection: "reference",
             slug: "widget-test",
             componentId: 0

        });

    </script>

     

</body>
